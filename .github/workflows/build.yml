name: Bauen und prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    name: Tests und Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -q PySide6 pytest ruff
      - name: Code-Stil (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: QML prüfen
        run: |
          cd shell/glimra_shell/qml
          pyside6-qmllint -I . main.qml preview.qml Glimra/*.qml 2>&1 | tee /tmp/qmllint.log
          ! grep -q "^Error" /tmp/qmllint.log
      - name: Oberfläche starten (Vorschau)
        run: |
          cd shell
          QT_QPA_PLATFORM=offscreen timeout 60 python -m glimra_shell --preview --screenshot /tmp/glimra.png
          test -s /tmp/glimra.png

  iso:
    name: ISO ${{ matrix.edition }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [desktop, server]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: pacman -Syu --noconfirm --needed archiso
      - name: ISO bauen
        run: ./build.sh ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}
          path: out/*.iso
          compression-level: 0
          retention-days: 7

  apk:
    name: GlimraApp (APK)
    needs: check
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GLIMRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signaturschlüssel einrichten
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GLIMRA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk "GlimraApp-$(cat VERSION).apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: GlimraApp-*.apk

  exe:
    name: Setup-Manager (EXE)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bauen
        run: |
          python -m pip install -q pyinstaller
          python tools/make_version_info.py
          pyinstaller --noconfirm --onefile --windowed --name GlimraSetup `
            --icon windows/glimra_setup/assets/glimra.ico `
            --version-file windows/version_info.txt `
            --add-data "windows/glimra_setup/assets;glimra_setup/assets" `
            --paths windows windows/run_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/GlimraSetup.exe
