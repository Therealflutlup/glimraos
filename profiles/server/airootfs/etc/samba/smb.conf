# Glimra OS Server – Dateifreigaben
[global]
   workgroup = WORKGROUP
   server string = Glimra OS Server
   server role = standalone server
   map to guest = Bad User
   log file = /var/log/samba/%m.log

# Jeder Benutzer sieht seinen eigenen Ordner
[homes]
   comment = Persönlicher Ordner
   browseable = no
   read only = no
   valid users = %S
